.base_windows_build:
  interruptible: true
  dependencies: []
  before_script:
    - powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
    - uv sync
    - uv run python Tools/setup.py
    - git submodule sync --recursive
    - git submodule update --init --recursive
  tags:
    - windows
  artifacts:
    expire_in: "2 weeks"
    paths:
      - Build/Deploy

.base_linux_build:
  interruptible: true
  dependencies: []
  before_script:
    # Otherwise libglib2 needs interaction
    - export DEBIAN_FRONTEND=noninteractive
    - apt update -y
    # Ubuntu 26.04 ships gcc 15, cmake 4.x and libwayland 1.24 out of the box, so
    # no gcc PPA, no kitware repo and no libwayland source build are needed here.
    # libwayland >= 1.23 is required: Qt 6.11's QtWaylandClient headers reference
    # the wl_fixes interface, which only exists in core Wayland from 1.23 onwards.
    # libvulkan-dev provides <vulkan/vulkan.h>; without it Qt's QVulkanInstance
    # is an incomplete type and ScreenPlayCore's graphics API probe fails to build.
    - apt install python3-venv libwayland-dev wayland-protocols libvulkan-dev curl wget zip unzip tar git pkg-config libxcb-* libfontconfig-dev apt-transport-https ca-certificates gnupg  software-properties-common python3 python3-pip build-essential cmake libgl1-mesa-dev mesa-common-dev lld ninja-build libxkbcommon-* libx11-dev xserver-xorg-dev xorg-dev -y
    - gcc --version
    - g++ --version
    - cmake --version
    # Install uv
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv sync
    - uv run python Tools/setup.py
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - chmod +x Tools/setup_linux.sh
    - ./Tools/setup_linux.sh
  image:
    name: ubuntu:26.04
  tags:
    - docker
    - docker_internal_vm
  artifacts:
    expire_in: "4 weeks"
    paths:
      - Build/Deploy

.base_osx_build:
  interruptible: true
  dependencies: []
  before_script:
    # Make sure to use the correct Python version
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    - which python3
    # Install uv
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv sync
    - uv run python Tools/setup.py
    - git submodule sync --recursive
    - git submodule update --init --recursive
  tags:
    - osx
  artifacts:
    expire_in: "4 weeks"
    paths:
      - Build/Deploy