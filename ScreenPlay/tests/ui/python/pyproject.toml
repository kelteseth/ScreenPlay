[project]
name = "screenplay-timeline-ui-tests"
version = "0.0.0"
description = "chuck_tester-driven UI tests for ScreenPlay's Timeline component"
requires-python = ">=3.12"
dependencies = [
    "chuck",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[tool.uv.sources]
chuck = { path = "../../../../ThirdParty/chuck_tester/chuck", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
